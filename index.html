<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Central Gateway</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-box">
        <h2 style="color:#0f172a; margin-top:0; font-size:24px; text-align:center;">Summer Portal Login</h2>
        <p style="color:#64748b; font-size:14px; text-align:center; margin-bottom:30px;">Access your workspace parameters safely.</p>
        
        <form id="loginForm">
            <label style="font-weight:600; font-size:14px;">User Account Identifier (ID / Username)</label>
            <input type="text" id="username" placeholder="e.g. 202610045" required>
            
            <label style="font-weight:600; font-size:14px;">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
            
            <label style="font-weight:600; font-size:14px;">Target System Role Portal</label>
            <select id="userRole">
                <option value="student">Student Dashboard</option>
                <option value="supervisor">Academic Supervisor Desk</option>
                <option value="finance">Finance Office Gateway</option>
                <option value="admin">Central Registrar Dashboard</option>
            </select>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">Authenticate Identity</button>
        </form>
    </div>

    <script>
        // الصق الرابط المستخرج لـ Web App التابع لـ Apps Script هنا
        const API_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"; 

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const r = document.getElementById('userRole').value;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', payload: { username: u, password: p, role: r } })
                });
                const result = await response.json();
                
                if (result.success) {
                    localStorage.setItem('sessionToken', result.token);
                    localStorage.setItem('userEmail', result.email);
                    localStorage.setItem('userRole', r);
                    localStorage.setItem('displayName', result.name);
                    
                    window.location.href = r + '.html';
                } else {
                    alert("Authentication Failure: " + result.message);
                }
            } catch(err) {
                alert("Network Connection Error to Central Server.");
            }
        });
    </script>
</body>
</html>
