<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Identity Provider - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-box">
        <h2 style="color:#0056b3;">University Central Login</h2>
        <p style="color:#666;">Sign in using your corporate M365 / Google Student Account</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <form id="loginForm">
            <label style="text-align: left; display: block;">University Email Address</label>
            <input type="email" id="userEmail" placeholder="username@univ.edu.eg" required>
            
            <label style="text-align: left; display: block; margin-top: 15px;">System Gateway Role</label>
            <select id="userRole">
                <option value="student">Student Portal</option>
                <option value="supervisor">Academic Supervisor Portal</option>
                <option value="finance">Finance & Accounting Office</option>
                <option value="admin">Central Registrar Dashboard</option>
            </select>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px; padding: 12px;">Secure Log In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('userEmail').value.trim();
            const role = document.getElementById('userRole').value;
            
            if(!email) return;
            
            // Storing Identity locally in session
            localStorage.setItem('userEmail', email);
            
            // Routing based on system portal authorization mapping
            if (role === 'student') window.location.href = 'student.html';
            if (role === 'supervisor') window.location.href = 'supervisor.html';
            if (role === 'finance') window.location.href = 'finance.html';
            if (role === 'admin') window.location.href = 'admin.html';
        });
    </script>
</body>
</html>
