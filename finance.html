<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bursar Office Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* الحفاظ على نفس تصميم الجدول والأزرار بدون أي فقدان */
        .history-box {
            background: #f1f5f9;
            border-radius: 4px;
            padding: 6px 10px;
            margin-top: 5px;
            font-size: 12px;
            border-left: 3px solid #0284c7;
        }
        .reprint-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }
        .reprint-btn:hover { background: #0369a1; }
        
        /* إخفاء إطار الطباعة من العرض المرئي */
        #printFrame {
            display: none;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-brand">
            <h2>Student Accounts Ledger Desk</h2>
        </div>
        <div>
            <span id="financeUserLabel" style="margin-right:20px; font-weight:600;"></span>
            <button class="btn btn-danger" style="padding: 6px 14px;" onclick="logout()">Disconnect</button>
        </div>
    </div>

    <div class="container">
        <div style="background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e2e8f0;">
            <label style="font-weight:600; font-size:14px; color:#1e293b;">تعديل نص سبب الدفع (البيان المطبوع بالإيصال):</label>
            <input type="text" id="receiptReasonText" value="رسوم جدية حجز خريف 2026-2027" style="width:100%; max-width:500px; display:block; margin-top:5px; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
        </div>

        <h3>Tuition Clearing Pipeline (Max 2 Installments Enforced)</h3>
        
        <table id="ledgerTable">
            <thead>
                <tr>
                    <th>Student Profile</th>
                    <th>Financial Status</th>
                    <th>Payment Method & Date</th>
                    <th>Amount to Pay & Ref</th>
                    <th>Accounting Controls</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <iframe id="printFrame"></iframe>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw4awY4Hrgsm9-YmmtZPCQIbruqjS_m7dlFDlzuQIzj6utMsiTGWtvMv9JkFfCvPUwq/exec";
        const sessionToken = localStorage.getItem('sessionToken');
        const userRole = localStorage.getItem('userRole');

        if (!sessionToken || userRole !== 'finance') { window.location.href = 'index.html'; }
        document.getElementById('financeUserLabel').innerText = "Desk Operator: " + localStorage.getItem('displayName');

        function tafqeet(num) {
            if(num === 0) return "صفر";
            const ones = ["", "واحد", "اثنان", "ثلاثة", "أربعة", "خمسة", "ستة", "سبعة", "ثمانية", "تسعة"];
            const tens = ["", "عشرة", "عشرون", "ثلاثون", "أربعون", "خمسون", "ستون", "سبعون", "ثمانون", "تسعون"];
            const hundreds = ["", "مائة", "مائتان", "ثلاثمائة", "أربعمائة", "خمسمائة", "ستمائة", "سبعمائة", "ثمانمائة", "تسعمائة"];
            
            function convertUnderThousand(n) {
                let text = "";
                let h = Math.floor(n / 100);
                let rem = n % 100;
                let t = Math.floor(rem / 10);
                let o = rem % 10;
                
                if (h > 0) text += hundreds[h];
                if (rem > 0) {
                    if (text !== "") text += " و ";
                    if (rem === 11) text += "أحد عشر";
                    else if (rem === 12) text += "اثنا عشر";
                    else if (rem < 10) text += ones[o];
                    else if (rem < 20) text += ones[o] + " عشر";
                    else {
                        if (o > 0) text += ones[o] + " و ";
                        text += tens[t];
                    }
                }
                return text;
            }

            let str = "";
            let thousands = Math.floor(num / 1000);
            let remThousand = num % 1000;

            if (thousands > 0) {
                if(thousands === 1) str += "ألف";
                else if(thousands === 2) str += "ألفان";
                else if(thousands >= 3 && thousands <= 10) str += convertUnderThousand(thousands) + " آلاف";
                else str += convertUnderThousand(thousands) + " ألف";
            }
            
            if (remThousand > 0) {
                if (str !== "") str += " و ";
                str += convertUnderThousand(remThousand);
            }
            return str + " جنيهاً مصرياً لا غير";
        }

        async function pullLedger() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getFinanceDashboard', payload: { sessionToken: sessionToken } })
                });
                const data = await res.json();
                if (!data.success) { alert(data.message); return; }

                const tbody = document.querySelector('#ledgerTable tbody');
                tbody.innerHTML = '';

                data.requests.forEach(r => {
                    const tr = document.createElement('tr');
                    const reconciled = r.remainingAmount <= 0;
                    const todayStr = new Date().toISOString().split('T')[0];
                    const isSecondInstallment = (r.paymentsHistory && r.paymentsHistory.length === 1);

                    let historyHTML = "";
                    if(r.paymentsHistory && r.paymentsHistory.length > 0) {
                        historyHTML = `<div style="margin-top:8px;">`;
                        r.paymentsHistory.forEach((p, index) => {
                            historyHTML += `
                                <div class="history-box">
                                    <strong>قسط ${index+1}:</strong> ${p.amount} EGP بتاريخ ${new Date(p.date).toLocaleDateString('en-GB')}
                                    <button class="reprint-btn" onclick="executeDirectPrint('${p.receiptNo}', '${r.studentName}', '${r.studentId}', '${r.faculty}', ${p.amount}, '${p.date}', '${p.method}')">🖨️ طباعة هذا الإيصال</button>
                                </div>`;
                        });
                        historyHTML += `</div>`;
                    }

                    // إجبار واجهة القسط الثاني على سحب الباقي تماماً وغلق خانة التعديل
                    let amountFieldHTML = `<input type="number" id="amt-${r.requestId}" value="${r.remainingAmount}" max="${r.remainingAmount}" min="1" ${reconciled ? 'disabled' : ''} ${isSecondInstallment ? 'readonly title="القسط الأخير يجب أن يكون مطابقاً للمبلغ المتبقي"' : ''} placeholder="Amt to Pay" style="margin:0 0 8px 0; padding:6px; font-size:13px; ${isSecondInstallment ? 'background-color:#e2e8f0;' : ''}">`;

                    tr.innerHTML = `
                        <td><strong>${r.studentName}</strong><br><small style="color:#64748b;">ID: ${r.studentId} | الكلية: ${r.faculty}</small></td>
                        <td>
                            <div style="font-weight:700; color:#0f172a;">Total: ${r.totalFees} EGP</div>
                            <div style="font-size:12px; color:var(--success-color);">Paid: ${r.paidAmount} EGP</div>
                            <div style="font-size:12px; color:var(--danger-color);">Due: ${r.remainingAmount} EGP</div>
                            <span class="badge" style="background:#e0f2fe; color:#0369a1; margin-top:5px; display:inline-block;">${r.status}</span>
                            ${historyHTML}
                        </td>
                        <td>
                            <select id="method-${r.requestId}" ${reconciled ? 'disabled' : ''} style="margin: 0 0 8px 0; padding: 6px; font-size: 13px;">
                                <option value="Cash at Uni">Cash at University Campus</option>
                                <option value="InstaPay">InstaPay Transfer</option>
                                <option value="Bank Transfer">Bank Account Deposit</option>
                            </select>
                            <input type="date" id="date-${r.requestId}" value="${todayStr}" ${reconciled ? 'disabled' : ''} style="margin:0; padding:6px; font-size:13px;">
                        </td>
                        <td>
                            ${amountFieldHTML}
                            <input type="text" id="tx-${r.requestId}" ${reconciled ? 'disabled' : ''} placeholder="Ref No. (Optional)" style="margin:0; padding:6px; font-size:13px;">
                        </td>
                        <td>
                            ${reconciled ? `<span style="color:var(--success-color); font-weight:600; font-size:13px;">Fully Reconciled ✓</span>` : `
                                <div style="display:flex; flex-direction:column; gap:5px;">
                                    <button class="btn btn-success" style="padding:6px; font-size:12px;" onclick="commitPaymentAndPrint('${r.requestId}', '${r.studentName}', '${r.studentId}', '${r.faculty}')">تأكيد الدفع وطباعة الإيصال</button>
                                </div>
                            `}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) { alert("Ledger interface generation breakdown."); }
        }

        async function commitPaymentAndPrint(reqId, stuName, stuId, faculty) {
            const txToken = document.getElementById(`tx-${reqId}`).value.trim() || 'CASH';
            const payMethod = document.getElementById(`method-${reqId}`).value;
            const payDate = document.getElementById(`date-${reqId}`).value;
            const payAmt = document.getElementById(`amt-${reqId}`).value;

            if(!payAmt || payAmt <= 0) { alert("رجاءً، أدخل مبلغ مالي صحيح لإتمام عملية الدفع."); return; }

            const btn = event.target;
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'processFinanceAction',
                        payload: { 
                            sessionToken: sessionToken, 
                            requestId: reqId, 
                            amountToPay: payAmt,
                            refNum: txToken,
                            paymentMethod: payMethod,
                            paymentDate: payDate,
                            email: localStorage.getItem('userEmail') 
                        }
                    })
                });
                const out = await res.json();
                
                if(out.success) {
                    executeDirectPrint(out.receiptNo, stuName, stuId, faculty, payAmt, payDate, payMethod);
                    pullLedger();
                } else {
                    alert(out.message);
                    btn.innerText = "تأكيد الدفع وطباعة الإيصال";
                    btn.disabled = false;
                }
            } catch(e) { 
                alert("Transaction processing block hit."); 
                btn.innerText = "تأكيد الدفع وطباعة الإيصال";
                btn.disabled = false;
            }
        }

        // دالة الطباعة عبر الـ Iframe لمنع التداخل أو تكرار الصفحات تماماً
        function executeDirectPrint(receiptNo, name, id, faculty, amount, date, method) {
            const reasonText = document.getElementById('receiptReasonText').value;
            const d = new Date(date);
            const printDate = d.toLocaleDateString('en-GB');
            const printTime = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            const amountText = tafqeet(Number(amount));

            const receiptHTML = `
                <!DOCTYPE html>
                <html lang="ar" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <style>
                        @page { size: A5 landscape; margin: 0; }
                        body {
                            margin: 0;
                            padding: 10mm;
                            width: 210mm;
                            height: 148mm;
                            box-sizing: border-box;
                            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                            background: white;
                        }
                        .receipt-container {
                            border: 2px solid #000;
                            padding: 8px;
                            height: 100%;
                            box-sizing: border-box;
                        }
                        .receipt-inner-border {
                            border: 1px solid #444;
                            padding: 15px;
                            height: 100%;
                            box-sizing: border-box;
                            position: relative;
                        }
                        .receipt-header {
                            display: table;
                            width: 100%;
                            border-bottom: 2px solid #000;
                            padding-bottom: 8px;
                            margin-bottom: 12px;
                        }
                        .receipt-header-cell {
                            display: table-cell;
                            vertical-align: middle;
                        }
                        .receipt-box-top {
                            border: 1px solid #000;
                            padding: 6px 12px;
                            border-radius: 4px;
                            text-align: left;
                            direction: ltr;
                            font-family: Arial, sans-serif;
                            font-size: 13px;
                        }
                        .receipt-title {
                            text-align: center;
                            font-size: 20px;
                            font-weight: bold;
                            margin: 10px 0;
                            letter-spacing: 1px;
                        }
                        .receipt-row {
                            display: table;
                            width: 100%;
                            margin-bottom: 12px;
                            font-size: 15px;
                            border-bottom: 1px dashed #aaa;
                            padding-bottom: 4px;
                        }
                        .receipt-cell-inline {
                            display: table-cell;
                        }
                        .receipt-amount-box {
                            border: 2px solid #000;
                            padding: 6px 15px;
                            font-weight: bold;
                            font-size: 18px;
                            border-radius: 4px;
                            background: #fff;
                            float: left;
                            direction: ltr;
                        }
                        .receipt-footer {
                            display: table;
                            width: 100%;
                            margin-top: 25px;
                        }
                        .receipt-footer-cell {
                            display: table-cell;
                            vertical-align: bottom;
                            width: 33.33%;
                        }
                        .receipt-stamp {
                            width: 95px;
                            height: 95px;
                            border: 1px solid #aaa;
                            border-radius: 50%;
                            margin: 0 auto;
                            text-align: center;
                            color: #777;
                            font-size: 11px;
                            padding-top: 28px;
                            box-sizing: border-box;
                            transform: rotate(-10deg);
                        }
                    </style>
                </head>
                <body>
                    <div class="receipt-container">
                        <div class="receipt-inner-border">
                            <div class="receipt-header">
                                <div class="receipt-header-cell" style="width:35%;">
                                    <div class="receipt-box-top">
                                        <div style="font-weight:bold; margin-bottom:2px;">Receipt No: <span>${receiptNo}</span></div>
                                        <div>Date: <span>${printDate}</span></div>
                                    </div>
                                </div>
                                <div class="receipt-header-cell" style="width:30%; text-align:center;">
                                    <div style="font-weight: 800; font-size: 16px; border: 1px solid #000; padding: 4px; display: inline-block;">UNIVERSITY of EAST CAPITAL</div>
                                </div>
                                <div class="receipt-header-cell" style="width:35%; text-align:left;">
                                    <h2 style="margin:0; font-size:22px; font-weight:bold;">جامعة شرق العاصمة</h2>
                                    <p style="margin:0; font-size:13px; font-weight:600; color:#444;">إدارة الحسابات والخزينة</p>
                                </div>
                            </div>
                            <div class="receipt-title">إيصـال اسـتلام نقديـة (CASH RECEIPT)</div>
                            <div class="receipt-row">
                                <div class="receipt-cell-inline" style="width:18%; font-weight:bold;">استلمنا من السيد/ة:</div>
                                <div class="receipt-cell-inline" style="font-weight:bold; font-size:17px; text-align:right;">${name}</div>
                            </div>
                            <div class="receipt-row">
                                <div class="receipt-cell-inline" style="width:50%;">
                                    <span style="font-weight:bold;">الكلية المقيد بها:</span> 
                                    <span style="font-weight:600;">${faculty}</span>
                                </div>
                                <div class="receipt-cell-inline" style="width:50%; text-align:left;">
                                    <span style="font-weight:bold;">رقم الملف:</span> 
                                    <span style="font-weight:bold; font-size:16px;">${id}</span>
                                </div>
                            </div>
                            <div class="receipt-row" style="border-bottom:none; margin-bottom:5px;">
                                <div class="receipt-cell-inline" style="vertical-align: middle; font-weight:bold; width:22%;">مبلغاً وقدره (بالحروف):</div>
                                <div class="receipt-cell-inline" style="vertical-align: middle; font-weight:bold; text-align:center; font-size:14px; padding:0 5px;">${amountText}</div>
                                <div class="receipt-cell-inline" style="width:25%;">
                                    <div class="receipt-amount-box">EGP <span>${amount}</span></div>
                                </div>
                            </div>
                            <div class="receipt-row" style="margin-top:10px;">
                                <div class="receipt-cell-inline" style="width:12%; font-weight:bold;">وذلك قيمة:</div>
                                <div class="receipt-cell-inline" style="font-weight:600; text-align:right;">${reasonText}</div>
                            </div>
                            <div class="receipt-footer">
                                <div class="receipt-footer-cell" style="text-align:right; font-size:11px; font-family:Arial, sans-serif; line-height:1.4;">
                                    Time: <span>${printTime}</span><br>
                                    Payment: <span>${method}</span>
                                </div>
                                <div class="receipt-footer-cell">
                                    <div class="receipt-stamp">الختم الرسمي<br>Official Stamp</div>
                                </div>
                                <div class="receipt-footer-cell" style="text-align:center;">
                                    <div style="border-top:1.5px solid #000; width:85%; margin:0 auto; padding-top:4px; font-weight:bold; font-size:14px;">
                                        توقيع المستلم<br><span style="font-size:12px; font-weight:normal;">(Cashier)</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </body>
                </html>
            `;

            const iframe = document.getElementById('printFrame');
            iframe.contentWindow.document.open();
            iframe.contentWindow.document.write(receiptHTML);
            iframe.contentWindow.document.close();

            // إعطاء وقت قصير للإطار لمعالجة الـ CSS ثم إطلاق أمر الطباعة
            setTimeout(() => {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            }, 300);
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        window.onload = pullLedger;
    </script>
</body>
</html>
