<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Finance Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .history-box {
            background: #f1f5f9;
            border-radius: 4px;
            padding: 6px 10px;
            margin-top: 5px;
            font-size: 12px;
            border-left: 3px solid #0284c7;
        }
        .reprint-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }
        .reprint-btn:hover { background: #0369a1; }
        
        #printFrame { display: none; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-brand">
            <h2>Student Financial Services</h2>
        </div>
        <div>
            <span id=\"financeUserLabel\" style=\"margin-right:20px; font-weight:600;\"></span>
            <button class="btn btn-danger" style="padding: 6px 14px;" onclick="logout()">Disconnect</button>
        </div>
    </div>

    <div class="container">
        <h3>Financial Ledger & Revenue Pipeline</h3>
        <p style="color:#64748b; margin-bottom:25px;">Process student financial statements, record single or multi-stage installment models, and track immediate institutional revenue parameters.</p>

        <table id="ledgerTable">
            <thead>
                <tr>
                    <th>Student Identity</th>
                    <th>Academic Faculty</th>
                    <th>Tuition Metrics</th>
                    <th>Amortization & Logs</th>
                    <th>Payment Action Gateway</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <iframe id="printFrame"></iframe>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw4awY4HrgsH8HscGvW-M74zXm8uF_gG3Y9lD8x-u03uor-9fR_l1wT7D8K_3-TshmU/exec"; 
        const sessionToken = localStorage.getItem('sessionToken');
        const userRole = localStorage.getItem('userRole');

        if(!sessionToken || userRole !== 'finance') {
            window.location.href = 'index.html';
        }

        document.getElementById('financeUserLabel').innerText = `Cashier Workspace: ${localStorage.getItem('displayName') || 'Authorized Object'}`;

        async function pullLedger() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getFinanceLedger', payload: { sessionToken: sessionToken } })
                });
                const result = await res.json();
                if(!result.success) { alert(result.message); return; }

                const tbody = document.querySelector("#ledgerTable tbody");
                tbody.innerHTML = "";

                const todayString = new Date().toISOString().split('T')[0];

                result.ledger.forEach(item => {
                    const req = item.request;
                    const tr = document.createElement("tr");

                    let historyHTML = "";
                    if(item.history && item.history.length > 0) {
                        item.history.forEach(p => {
                            historyHTML += `
                                <div class="history-box">
                                    <button class="reprint-btn" onclick="triggerReprint('${item.studentName}','${item.faculty}',${p.AmountPaid},'${p.ReferenceNumber}','${p.PaymentID}','${p.PaymentDate}')">طباعة الإيصال</button>
                                    إيصال: <b>${p.PaymentID}</b> | قسط: <b>${p.AmountPaid} EGP</b> <br>
                                    تاريخ السداد: ${p.PaymentDate} | مرجع: ${p.ReferenceNumber}
                                </div>
                            `;
                        });
                    } else {
                        historyHTML = `<span style="color:#94a3b8; font-style:italic;">No logged transactions</span>`;
                    }

                    let controlHTML = "";
                    if(item.remainingFees <= 0) {
                        controlHTML = `<span class="badge success" style="font-size:13px; font-weight:600;">Fully Cleared ✓</span>`;
                    } else {
                        controlHTML = `
                            <div style="display:flex; flex-direction:column; gap:8px; max-width:260px;">
                                <div>
                                    <label style="font-size:11px; font-weight:600; display:block; margin:0;">تاريخ السداد الفعلي:</label>
                                    <input type="date" id="date-${req.RequestID}" value="${todayString}" style="padding:6px; margin:2px 0; font-size:12px; border-radius:4px; border:1px solid #cbd5e1; width:100%;">
                                </div>
                                <div style="display:flex; gap:4px;">
                                    <input type="number" id="amt-${req.RequestID}" max="${item.remainingFees}" value="${item.remainingFees}" placeholder="Amount" style="padding:6px; margin:0; font-size:12px; flex:1;">
                                    <select id="method-${req.RequestID}" style="padding:6px; margin:0; font-size:12px; flex:1;">
                                        <option value="Cash">Cash (نقدي)</option>
                                        <option value="Instapay">Instapay (إنستاباي)</option>
                                        <option value="Bank Transfer">Bank Transfer</option>
                                        <option value="Visa / Card">Visa / Card</option>
                                    </select>
                                </div>
                                <input type="text" id="ref-${req.RequestID}" placeholder="رقم المرجع الفني / الترانزأكشن" style="padding:6px; margin:0; font-size:12px;">
                                <button class="btn btn-success" style="padding:8px; font-size:12px; font-weight:600;" onclick="submitPayment('${req.RequestID}', '${req.StudentID}')">تأكيد عملية السداد</button>
                            </div>
                        `;
                    }

                    tr.innerHTML = `
                        <td>
                            <b>${item.studentName}</b><br>
                            <span style="color:#64748b; font-size:12px;">ID: ${req.StudentID}</span>
                        </td>
                        <td>${item.faculty}</td>
                        <td>
                            الإجمالي: <b style="color:#4E4099;">${req.TotalFees} EGP</b><br>
                            المدفوع: <span style="color:#0f766e; font-weight:600;">${item.totalPaid} EGP</span><br>
                            المتبقي: <span style="color:#be123c; font-weight:600;">${item.remainingFees} EGP</span>
                        </td>
                        <td>${historyHTML}</td>
                        <td>${controlHTML}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) { alert("Failed to fetch university revenue records matrix."); }
        }

        async function submitPayment(requestId, studentId) {
            const amount = document.getElementById(`amt-${requestId}`).value.trim();
            const method = document.getElementById(`method-${requestId}`).value;
            const ref = document.getElementById(`ref-${requestId}`).value.trim();
            const pDate = document.getElementById(`date-${requestId}`).value;

            if(!amount || Number(amount) <= 0) { alert("Please input a logical financial transaction amount."); return; }
            if(!ref) { alert("Please fill down the transaction financial reference key."); return; }
            if(!pDate) { alert("من فضلك حدد تاريخ السداد الفعلي الحقيقي."); return; }

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'recordPayment',
                        payload: {
                            sessionToken: sessionToken,
                            requestId: requestId,
                            studentId: studentId,
                            amountPaid: amount,
                            referenceNumber: ref,
                            paymentMethod: method,
                            paymentDate: pDate
                        }
                    })
                });
                const result = await res.json();
                alert(result.message);
                if(result.success) {
                    pullLedger();
                    // استخدام التاريخ الفعلي المختار للطباعة المباشرة بعد النجاح
                    const studentRow = result.studentName || document.querySelector(`#date-${requestId}`).closest('tr').cells[0].querySelector('b').innerText;
                    const facultyRow = document.querySelector(`#date-${requestId}`).closest('tr').cells[1].innerText;
                    triggerReprint(studentRow, facultyRow, amount, ref, result.receiptId, result.paymentDate);
                }
            } catch(e) { alert("Transmission fault logging transaction to central ledger sheet."); }
        }

        function triggerReprint(studentName, faculty, amount, ref, receiptId, paymentDate) {
            // توليد اللحظة الحالية للطباعة بالثواني
            const now = new Date();
            const printTime = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG');

            const receiptHTML = `
                <!DOCTYPE html>
                <html lang="ar">
                <head>
                    <meta charset="UTF-8">
                    <title>إيصال سداد رسوم دراسية - Receipt</title>
                    <style>
                        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; direction: rtl; margin: 0; padding: 20px; color: #000; background:#fff; }
                        .receipt-wrapper { border: 3px double #000; padding: 15px; max-width: 750px; margin: 0 auto; box-sizing: border-box; }
                        .receipt-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
                        .header-cell { width: 33.33%; }
                        .uni-title-ar { font-size: 17px; font-weight: bold; text-align: right; }
                        .uni-title-en { font-size: 15px; font-weight: bold; text-align: left; font-family: sans-serif; direction: ltr; }
                        .receipt-main-title { text-align: center; font-size: 20px; font-weight: dotted; border: 2px solid #000; padding: 4px 10px; background: #f8fafc; }
                        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; font-size: 14px; }
                        .info-item { border-bottom: 1px dashed #666; padding: 4px 0; }
                        .info-item span { font-weight: bold; }
                        .financial-box { border: 2px solid #000; background: #f1f5f9; padding: 10px; display: flex; justify-content: space-around; font-size: 16px; font-weight: bold; margin-bottom: 20px; }
                        .receipt-footer-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 30px; font-size: 12px; }
                        .receipt-footer-cell { display: flex; flex-direction: column; justify-content: space-between; height: 80px; }
                        .receipt-stamp { border: 2px dashed #000; width: 110px; height: 65px; text-align: center; line-height: 1.4; padding-top: 10px; font-size: 11px; font-weight: bold; color: #444; margin: 0 auto; }
                    </style>
                </head>
                <body>
                    <div class="receipt-wrapper">
                        <div class="receipt-header">
                            <div class="header-cell uni-title-ar">
                                جامعة العاصمة الشرقية<br>
                                إدارة الشؤون المالية<br>
                                برنامج السمر كورس
                            </div>
                            <div class="header-cell" style="text-align: center;">
                                <div class="receipt-main-title">إيصال سداد رسوم<br>Official Receipt</div>
                            </div>
                            <div class="header-cell uni-title-en">
                                University of East Capital<br>
                                Financial Department<br>
                                Summer Course Program
                            </div>
                        </div>

                        <div class="info-grid">
                            <div class="info-item">رقم الإيصال / Receipt ID: <span>${receiptId}</span></div>
                            <div class="info-item">تاريخ السداد الفعلي / Payment Date: <span style="font-size: 15px; color: #be123c;">${paymentDate}</span></div>
                            <div class="info-item">اسم الطالب / Student Name: <span>${studentName}</span></div>
                            <div class="info-item">الكلية / Faculty: <span>${faculty}</span></div>
                        </div>

                        <div class="financial-box">
                            <div>المبلغ المدفوع: ${amount} EGP</div>
                            <div>طريقة الدفع: ${method}</div>
                            <div>رقم المرجع: ${ref}</div>
                        </div>

                        <div style="font-size: 12px; text-align: center; color: #475569; border-top: 1px solid #cbd5e1; padding-top: 8px;">
                            يعتبر هذا الإيصال مستنداً رسمياً لتثبيت السداد المالي للوحدات المعتمدة، ولا يعتد به في حال إلغاء المعاملة البنكية.
                        </div>

                        <div class="receipt-footer-grid">
                            <div class="receipt-footer-cell" style="line-height: 1.5; color:#334155;">
                                مُصدر الإيصال: <span>${localStorage.getItem('displayName') || 'System Cashier'}</span>
                                تاريخ طبع الإيصال الفعلي:<br><span style="font-weight: bold; font-size:11px; color:#000;">${printTime}</span>
                            </div>
                            <div class="receipt-footer-cell">
                                <div class="receipt-stamp">الختم الرسمي<br>Official Stamp</div>
                            </div>
                            <div class="receipt-footer-cell" style="text-align:center;">
                                <div style="border-top:1.5px solid #000; width:85%; margin:0 auto; padding-top:4px; font-weight:bold; font-size:14px;">
                                    توقيع المستلم<br><span style="font-size:12px; font-weight:normal;">(Cashier)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </body>
                </html>
            `;

            const iframe = document.getElementById('printFrame');
            iframe.contentWindow.document.open();
            iframe.contentWindow.document.write(receiptHTML);
            iframe.contentWindow.document.close();

            setTimeout(() => {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            }, 300);
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        window.onload = pullLedger;
    </script>
</body>
</html>
