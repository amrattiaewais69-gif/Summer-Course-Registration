<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Finance Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .history-box {
            background: #f1f5f9;
            border-radius: 4px;
            padding: 6px 10px;
            margin-top: 5px;
            font-size: 12px;
            border-left: 3px solid #0284c7;
        }
        .reprint-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }
        .reprint-btn:hover { background: #0369a1; }
        
        #printFrame { display: none; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-brand">
            <h2>Student Financial Services</h2>
        </div>
        <div>
            <span id="financeUserLabel" style="margin-right:20px; font-weight:600;"></span>
            <button class="btn btn-danger" style="padding: 6px 14px;" onclick="logout()">Disconnect</button>
        </div>
    </div>

    <div class="container">
        <div style="background: #ffffff; padding: 15px 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; box-shadow: var(--card-shadow); display: flex; align-items: center; gap: 15px;">
            <span style="font-size: 18px;">🔍</span>
            <div style="flex-grow: 1; max-width: 400px;">
                <input type="text" id="searchStudentInput" onkeyup="filterStudentTable()" placeholder="Search by Student ID or Name..." style="margin: 0; padding: 10px 15px; border-radius: 6px; border: 1px solid #cbd5e1; width: 100%; font-size: 14px; transition: border-color 0.2s;">
            </div>
            <span style="font-size: 13px; color: #64748b; font-weight: 500; background: #f1f5f9; padding: 4px 10px; border-radius: 20px;">Live Search Mode</span>
        </div>

        <table id="ledgerTable">
            <thead>
                <tr>
                    <th>Student Specifications</th>
                    <th>Fees Status</th>
                    <th>Payment Parameters</th>
                    <th>Financial Input Controls</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <iframe id="printFrame"></iframe>

    <script>
        // سيقوم النظام تلقائياً بقراءة السكريبت، يرجى الحفاظ على الرابط الخاص بك هنا
        const API_URL = "https://script.google.com/macros/s/AKfycbw4awY4Hrgs..."; 
        const sessionToken = localStorage.getItem('sessionToken');
        const userRole = localStorage.getItem('userRole');
        const displayName = localStorage.getItem('displayName');

        if (!sessionToken || userRole !== 'finance') {
            alert("Unauthorized access. Redirecting to authentication portal.");
            window.location.href = 'index.html';
        }

        document.getElementById('financeUserLabel').innerText = `Financial Officer: ${displayName || 'Authorized Account'}`;

        let globalRequestsData = [];

        async function pullLedger() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getFinanceDashboard', payload: { sessionToken: sessionToken } })
                });
                const data = await res.json();
                if (!data.success) { alert(data.message); return; }

                globalRequestsData = data.requests; 

                const tbody = document.querySelector('#ledgerTable tbody');
                tbody.innerHTML = '';

                data.requests.forEach(r => {
                    const tr = document.createElement('tr');
                    const reconciled = r.remainingAmount <= 0;
                    const todayStr = new Date().toISOString().split('T')[0];
                    
                    let historyHTML = "";
                    if(r.paymentsHistory && r.paymentsHistory.length > 0) {
                        historyHTML = `<div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px;">`;
                        r.paymentsHistory.forEach((p, index) => {
                            const currentAmount = p.amount !== undefined ? p.amount : (p.AmountPaid !== undefined ? p.AmountPaid : 0);
                            const currentDate = p.date !== undefined ? p.date : (p.PaymentDate !== undefined ? p.PaymentDate : '');
                            const currentReceiptNo = p.receiptNo !== undefined ? p.receiptNo : (p.ReceiptNo !== undefined ? p.ReceiptNo : '');
                            const currentMethod = p.method !== undefined ? p.method : (p.PaymentMethod !== undefined ? p.PaymentMethod : '');

                            historyHTML += `
                                <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-left: 4px solid #0284c7; padding: 6px 12px; border-radius: 6px; font-size: 12px; text-align: left; direction: ltr; display: flex; justify-content: space-between; align-items: center; gap: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.02);">
                                    <div style="color: #334155; font-family: system-ui, -apple-system, sans-serif;">
                                        <span style="background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 10px; margin-right: 6px; text-transform: uppercase;">Item ${index+1}</span>
                                        <strong style="color: #0f172a; font-size: 13px;">${currentAmount} EGP</strong>
                                        <span style="color: #64748b; margin-left: 8px;">on ${currentDate ? new Date(currentDate).toLocaleDateString('en-GB') : 'N/A'}</span>
                                        <span style="color: #64748b; margin-left: 8px;">via <span style="color: #0f766e; font-weight: 600;">${currentMethod || 'N/A'}</span></span>
                                    </div>
                                    <button class="reprint-btn" style="margin: 0; background: #0284c7; color: white; border: none; padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: 500; white-space: nowrap; transition: background 0.2s;" onmouseover="this.style.background='#0369a1'" onmouseout="this.style.background='#0284c7'" onclick="executeDirectPrint('${currentReceiptNo}', '${r.studentName}', '${r.studentId}', '${r.faculty}', ${currentAmount}, '${currentDate}', '${currentMethod}')">🖨️ Re-Print</button>
                                </div>`;
                        });
                        historyHTML += `</div>`;
                    }

                    let paymentControlsHTML = `
                        <div style="display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 280px;">
                            <div>
                                <label style="font-size: 11px; color: #64748b; font-weight: 600; display: block; margin-bottom: 2px;">Amount to Pay (EGP)</label>
                                <input type="number" id="amt-${r.requestId}" value="${r.remainingAmount}" max="${r.remainingAmount}" min="0" ${reconciled ? 'disabled' : ''} style="margin: 0; padding: 6px; font-size: 13px; width: 100%;">
                            </div>
                            <div style="display: flex; gap: 6px;">
                                <div style="flex: 1;">
                                    <label style="font-size: 11px; color: #64748b; font-weight: 600; display: block; margin-bottom: 2px;">Discount %</label>
                                    <input type="number" id="disc-${r.requestId}" min="0" max="100" value="0" ${reconciled ? 'disabled' : ''} placeholder="0" style="margin: 0; padding: 6px; font-size: 13px; width: 100%;" 
                                        oninput="calculateDiscount('${r.requestId}', ${r.totalFees}, ${r.remainingAmount})">
                                </div>
                                <div style="flex: 1;">
                                    <label style="font-size: 11px; color: #64748b; font-weight: 600; display: block; margin-bottom: 2px;">Discount Amt</label>
                                    <input type="number" id="discVal-${r.requestId}" value="0" disabled style="margin: 0; padding: 6px; font-size: 13px; width: 100%; background: #f1f5f9; color: #64748b; font-weight: 600;">
                                </div>
                            </div>
                            <div>
                                <label style="font-size: 11px; color: #64748b; font-weight: 600; display: block; margin-bottom: 2px;">Approved By</label>
                                <input type="text" id="appr-${r.requestId}" placeholder="e.g., Dean / Vice Dean" ${reconciled ? 'disabled' : ''} style="margin: 0; padding: 6px; font-size: 13px; width: 100%;">
                            </div>
                            <div>
                                <label style="font-size: 11px; color: #64748b; font-weight: 600; display: block; margin-bottom: 2px;">Ref No. (Optional)</label>
                                <input type="text" id="tx-${r.requestId}" ${reconciled ? 'disabled' : ''} placeholder="Ref No." style="margin: 0; padding: 6px; font-size: 13px; width: 100%;">
                            </div>
                        </div>
                    `;

                    tr.innerHTML = `
                        <td><strong>${r.studentName}</strong><br><small style="color:#64748b;">ID: ${r.studentId} | Faculty: ${r.faculty}</small></td>
                        <td>
                            <div style="font-weight:700; color:#0f172a;">Total: ${r.totalFees} EGP</div>
                            <div style="font-size:12px; color:var(--success-color);">Paid: ${r.paidAmount} EGP</div>
                            <div style="font-size:12px; color:var(--danger-color);">Due: ${r.remainingAmount} EGP</div>
                            <span class="badge" style="background:#e0f2fe; color:#0369a1; margin-top:5px; display:inline-block;">${r.status}</span>
                            ${historyHTML}
                        </td>
                        <td>
                            <select id="method-${r.requestId}" ${reconciled ? 'disabled' : ''} style="margin: 0 0 8px 0; padding: 6px; font-size: 13px;">
                                <option value="Cash at Uni">Cash at University Campus</option>
                                <option value="InstaPay">InstaPay Transfer</option>
                                <option value="Bank Transfer">Bank Account Deposit</option>
                            </select>
                            <input type="date" id="date-${r.requestId}" value="${todayStr}" ${reconciled ? 'disabled' : ''} style="margin:0; padding:6px; font-size:13px;">
                        </td>
                        <td>
                            ${paymentControlsHTML}
                        </td>
                        <td>
                            ${reconciled ? `<span style="color:var(--success-color); font-weight:600; font-size:13px;">Fully Reconciled ✓</span>` : `
                                <div style="display:flex; flex-direction:column; gap:5px;">
                                    <button class="btn btn-success" style="padding:6px; font-size:12px;" onclick="commitPaymentAndPrint('${r.requestId}', '${r.studentName}', '${r.studentId}', '${r.faculty}')">Confirm Payment & Print Receipt</button>
                                </div>
                            `}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) { alert("Ledger interface generation breakdown."); }
        }

        function calculateDiscount(requestId, totalFees, remainingAmount) {
            const discInput = document.getElementById(`disc-${requestId}`);
            const amtInput = document.getElementById(`amt-${requestId}`);
            const discValInput = document.getElementById(`discVal-${requestId}`);
            
            let discPercent = parseFloat(discInput.value) || 0;
            if (discPercent > 100) { discPercent = 100; discInput.value = 100; }
            if (discPercent < 0) { discPercent = 0; discInput.value = 0; }
            
            // حساب قيمة الخصم بناءً على إجمالي مصاريف تسجيل الطالب الأصلية
            const discountAmount = Math.round(totalFees * (discPercent / 100));
            discValInput.value = discountAmount;
            
            // خصم القيمة تلقائياً لتحديث المطلوب دفعه حالياً
            let newAmountToPay = remainingAmount - discountAmount;
            if (newAmountToPay < 0) { newAmountToPay = 0; }
            
            amtInput.value = newAmountToPay;
        }

        async function commitPaymentAndPrint(requestId, studentName, studentId, faculty) {
            const amount = document.getElementById(`amt-${requestId}`).value;
            const method = document.getElementById(`method-${requestId}`).value;
            const date = document.getElementById(`date-${requestId}`).value;
            const refNo = document.getElementById(`tx-${requestId}`).value;
            
            const discount = document.getElementById(`disc-${requestId}`).value || 0;
            const approver = document.getElementById(`appr-${requestId}`).value || '';

            if (amount === '' || amount < 0) { alert("Please enter a valid payment amount."); return; }
            if (parseFloat(discount) > 0 && !approver.trim()) { 
                alert("Please specify who approved this discount combination."); 
                return; 
            }

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'processPayment', 
                        payload: { 
                            sessionToken: sessionToken, 
                            requestId, amount, method, date, refNo,
                            discountPercent: discount,
                            approvedBy: approver
                        } 
                    })
                });
                const result = await res.json();
                if(result.success) {
                    alert("Transaction completed successfully!");
                    if (parseFloat(amount) > 0) {
                        executeDirectPrint(result.receiptNo || 'N/A', studentName, studentId, faculty, amount, date, method);
                    }
                    pullLedger(); 
                } else {
                    alert(result.message);
                }
            } catch(e) { alert("Error processing payment transaction."); }
        }

        function executeDirectPrint(receiptNo, name, id, faculty, amount, date, method) {
            const printTime = new Date().toLocaleString('en-US');
            const receiptHTML = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Official Payment Receipt</title>
                    <style>
                        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 30px; color: #333; direction: ltr; }
                        .receipt-container { border: 2px solid #000; padding: 25px; border-radius: 8px; max-width: 650px; margin: 0 auto; background: #fff; }
                        .receipt-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #000; padding-bottom: 15px; margin-bottom: 20px; }
                        .uni-title { font-size: 20px; font-weight: bold; color: #4E4099; text-transform: uppercase; }
                        .receipt-title { font-size: 22px; font-weight: bold; text-align: center; background: #000; color: #fff; padding: 5px 15px; border-radius: 4px; }
                        .receipt-meta { font-size: 13px; text-align: right; line-height: 1.6; }
                        .receipt-body { font-size: 15px; line-height: 2; margin-bottom: 25px; }
                        .highlight { font-weight: bold; color: #000; border-bottom: 1px dotted #000; padding: 0 4px; }
                        .receipt-footer { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; border-top: 2px dashed #000; padding-top: 15px; margin-top: 20px; font-size: 13px; }
                        .receipt-footer-cell { display: flex; flex-direction: column; justify-content: space-between; }
                        .receipt-stamp { border: 2px dashed #bbb; border-radius: 50%; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10px; font-weight: bold; color: #aaa; margin: 0 auto; transform: rotate(-15deg); text-transform: uppercase; }
                    </style>
                </head>
                <body>
                    <div class="receipt-container">
                        <div class="receipt-header">
                            <div>
                                <div class="uni-title">University of East Capital</div>
                                <div style="font-size:12px; color:#555;">Summer Semester Registration Fees</div>
                            </div>
                            <div class="receipt-title">RECEIPT</div>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-size:14px;">
                            <div>Receipt No: <span class="highlight">${receiptNo}</span></div>
                            <div class="receipt-meta">Date: ${new Date(date).toLocaleDateString('en-GB')}<br>Print Time: ${printTime}</div>
                        </div>
                        <div class="receipt-body">
                            Received from Student: <span class="highlight">${name}</span> &nbsp;&nbsp;&nbsp;&nbsp; ID: <span class="highlight">${id}</span><br>
                            Faculty / College: <span class="highlight">${faculty}</span><br>
                            The Sum of Amount: <span class="highlight" style="font-size:18px;">${amount} EGP</span><br>
                            Paid Settlement Via: <span class="highlight">${method}</span>
                        </div>
                        <div class="receipt-footer">
                            <div class="receipt-footer-cell">
                                Issued Date: <span>${new Date(date).toLocaleDateString('en-GB')}</span><br>
                                Print Time: <span>${printTime}</span><br>
                                Payment: <span>${method}</span>
                            </div>
                            <div class="receipt-footer-cell">
                                <div class="receipt-stamp">Official Stamp<br>الختم الرسمي</div>
                            </div>
                            <div class="receipt-footer-cell" style="text-align:center;">
                                <div style="border-top:1.5px solid #000; width:85%; margin:0 auto; padding-top:4px; font-weight:bold; font-size:14px;">
                                    Cashier Signature<br><span style="font-size:12px; font-weight:normal;">توقيع المستلم</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </body>
                </html>
            `;

            const iframe = document.getElementById('printFrame');
            iframe.contentWindow.document.open();
            iframe.contentWindow.document.write(receiptHTML);
            iframe.contentWindow.document.close();

            setTimeout(() => {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            }, 300);
        }

        function filterStudentTable() {
            const input = document.getElementById("searchStudentInput");
            const filter = input.value.toUpperCase();
            const tbody = document.querySelector("#ledgerTable tbody");
            const rows = tbody.getElementsByTagName("tr");

            for (let i = 0; i < rows.length; i++) {
                const studentInfoCell = rows[i].getElementsByTagName("td")[0];
                if (studentInfoCell) {
                    const txtValue = studentInfoCell.textContent || studentInfoCell.innerText;
                    if (txtValue.toUpperCase().indexOf(filter) > -1) {
                        rows[i].style.display = "";
                    } else {
                        rows[i].style.display = "none";
                    }
                }
            }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        window.onload = pullLedger;
    </script>
</body>
</html>
